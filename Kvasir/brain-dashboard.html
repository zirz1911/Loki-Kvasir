<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loki Brain — Knowledge Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:#0a0a0f; }
::-webkit-scrollbar-thumb { background:#1e1e2e; border-radius:3px; }

:root {
  --bg: #0a0a0f;
  --cyan: #26c6da;
  --purple: #7e57c2;
  --orange: #ffa726;
  --green: #66bb6a;
  --pink: #ec407a;
  --text: #e0e0e0;
  --dim: #555;
  --card: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.06);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

/* NAV */
.nav {
  position: fixed; top:0; left:0; right:0; z-index:100;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 28px;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  font-family: 'SF Mono', 'Fira Code', monospace;
}
.nav .brand {
  font-size: 15px; font-weight: 700; color: var(--cyan);
  letter-spacing: 4px; text-transform: uppercase;
}
.nav .badge {
  font-size: 10px; background: rgba(38,198,218,0.12);
  color: var(--cyan); padding: 2px 8px; border-radius: 99px;
  border: 1px solid rgba(38,198,218,0.25); letter-spacing: 2px;
}
.nav .live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); margin-left: auto;
  animation: pulse 2s ease-in-out infinite;
}
.nav .live-label { font-size: 11px; color: var(--green); letter-spacing: 1px; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

/* HERO */
.hero {
  padding: 90px 24px 32px;
  text-align: center;
  position: relative;
}
.hero h1 {
  font-size: clamp(32px, 5vw, 64px);
  font-weight: 200; letter-spacing: 14px; text-transform: uppercase;
  background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 50%, var(--orange) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero .sub {
  margin-top: 10px; font-size: 12px; color: var(--dim);
  letter-spacing: 3px; text-transform: uppercase;
}

/* STATS ROW */
.stats-row {
  display: flex; justify-content: center; gap: 12px;
  flex-wrap: wrap; padding: 0 24px 32px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 24px; min-width: 120px;
  text-align: center; position: relative; overflow: hidden;
  transition: border-color 0.3s;
}
.stat-card::before {
  content: ''; position: absolute; top:0; left:0; right:0; height:2px;
  background: var(--accent, var(--cyan));
}
.stat-card:hover { border-color: var(--accent, var(--cyan)); }
.stat-num {
  font-size: 28px; font-weight: 200;
  color: var(--accent, var(--cyan)); font-family: 'SF Mono', monospace;
}
.stat-label {
  font-size: 10px; color: var(--dim);
  letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;
}

/* GRAPH */
.graph-wrap {
  position: relative;
  margin: 0 auto; width: 100%; max-width: 1000px;
  height: 680px;
  border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; background: radial-gradient(ellipse at center, #0d0d1a 0%, var(--bg) 70%);
  margin-bottom: 32px;
}
#graph-svg { width: 100%; height: 100%; }
.graph-label {
  position: absolute; top: 16px; left: 20px;
  font-size: 10px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase;
}
.graph-hint {
  position: absolute; bottom: 16px; right: 20px;
  font-size: 10px; color: var(--dim); letter-spacing: 1px;
}

/* LEGEND */
.legend {
  display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
  padding: 0 24px 24px;
}
.legend-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: #888; letter-spacing: 1px;
}
.legend-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--c);
}

/* TOOLTIP */
#tooltip {
  position: fixed; pointer-events: none;
  background: rgba(10,10,20,0.95); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 10px 14px; font-size: 12px;
  backdrop-filter: blur(12px); z-index:999;
  max-width: 220px; display:none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#tooltip .t-topic { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
#tooltip .t-sub { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
#tooltip .t-date { font-size: 10px; color: #555; margin-top: 4px; }

/* GRID SECTION */
.section { padding: 0 24px 48px; max-width: 1200px; margin: 0 auto; }
.section-title {
  font-size: 11px; color: var(--dim); letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.folder-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.folder-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px;
  transition: border-color 0.3s, transform 0.2s;
  cursor: default;
}
.folder-card:hover {
  border-color: var(--fc, var(--cyan));
  transform: translateY(-2px);
}
.folder-card .fc-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.folder-card .fc-name {
  font-size: 12px; font-weight: 600;
  color: var(--fc, var(--cyan)); letter-spacing: 1px;
}
.folder-card .fc-count {
  font-size: 18px; font-weight: 200;
  color: var(--fc, var(--cyan)); font-family: 'SF Mono', monospace;
}
.folder-card .fc-bar {
  height: 3px; border-radius: 99px;
  background: rgba(255,255,255,0.05); margin-top: 10px; overflow: hidden;
}
.folder-card .fc-bar-fill {
  height: 100%; border-radius: 99px;
  background: var(--fc, var(--cyan));
  transition: width 1s ease;
}
.folder-card .fc-topics {
  margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px;
}
.topic-pill {
  font-size: 9px; padding: 2px 7px; border-radius: 99px;
  background: rgba(255,255,255,0.04); color: #666;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 150px;
}

/* FOOTER */
footer {
  text-align: center; padding: 32px; font-size: 11px; color: var(--dim);
  border-top: 1px solid var(--border); letter-spacing: 2px;
  text-transform: uppercase;
}
</style>
</head>

// ── Color map ──────────────────────────────────────
const COLOR = {
  'memory/learnings':     '#26c6da',
  'memory/retrospectives':'#7e57c2',
  'memory/resonance':     '#ffa726',
  'learn':                '#66bb6a',
  'lab':                  '#ec407a',
};
const FOLDER_COLOR = {
  'memory': '#26c6da',
  'learn':  '#66bb6a',
  'lab':    '#ec407a',
};

function nodeColor(d) {
  if (d.type === 'root')   return '#26c6da';
  if (d.type === 'folder') return FOLDER_COLOR[d.id] || '#888';
  if (d.type === 'sub')    return COLOR[d.id] || '#888';
  const key = d.folder + '/' + d.sub;
  return COLOR[key] || FOLDER_COLOR[d.folder] || '#888';
}

// ── Build graph data ────────────────────────────────
function buildGraph(raw) {
  const nodes = [], links = [];
  const seenFolders = new Set(), seenSubs = new Set();

  nodes.push({ id:'LOKI', label:'LOKI', type:'root', r:28, fixed:true });

  raw.forEach(item => {
    const fid = item.folder;
    const sid = item.folder + '/' + item.sub;

    if (!seenFolders.has(fid)) {
      seenFolders.add(fid);
      nodes.push({ id:fid, label:fid.toUpperCase(), type:'folder',
        folder:fid, r:18 });
      links.push({ source:'LOKI', target:fid, strength:0.8 });
    }
    if (item.sub && !seenSubs.has(sid)) {
      seenSubs.add(sid);
      nodes.push({ id:sid, label:item.sub, type:'sub',
        folder:item.folder, sub:item.sub, r:13 });
      links.push({ source:fid, target:sid, strength:0.6 });
    }

    const nid = sid + '/' + item.topic;
    nodes.push({ id:nid, label:item.topic, type:'leaf',
      folder:item.folder, sub:item.sub, date:item.date, r:5 });
    links.push({ source: item.sub ? sid : fid, target:nid, strength:0.3 });
  });

  return { nodes, links };
}

// ── D3 Force Graph ──────────────────────────────────
const { nodes, links } = buildGraph(RAW);
const svg = d3.select('#graph-svg');
const W = svg.node().parentElement.clientWidth;
const H = svg.node().parentElement.clientHeight;
svg.attr('viewBox', [0, 0, W, H]);

const g = svg.append('g');

// zoom
svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => g.attr('transform', e.transform)));

// defs — glow filter
const defs = svg.append('defs');
const filter = defs.append('filter').attr('id','glow');
filter.append('feGaussianBlur').attr('stdDeviation','3').attr('result','blur');
const merge = filter.append('feMerge');
merge.append('feMergeNode').attr('in','blur');
merge.append('feMergeNode').attr('in','SourceGraphic');

// simulation
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id)
    .distance(d => {
      if (d.source.type === 'root') return 120;
      if (d.source.type === 'folder') return 80;
      if (d.source.type === 'sub') return 50;
      return 30;
    })
    .strength(d => d.strength || 0.4)
  )
  .force('charge', d3.forceManyBody()
    .strength(d => d.type === 'root' ? -600 : d.type === 'folder' ? -250 : d.type === 'sub' ? -120 : -40))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collision', d3.forceCollide().radius(d => d.r + 3));

// links
const link = g.append('g')
  .selectAll('line').data(links).join('line')
  .attr('stroke', d => {
    const t = d.target.type || '';
    if (t === 'folder') return 'rgba(38,198,218,0.25)';
    if (t === 'sub')    return 'rgba(126,87,194,0.2)';
    return 'rgba(255,255,255,0.04)';
  })
  .attr('stroke-width', d => {
    const t = d.target.type || '';
    if (t === 'folder') return 1.5;
    if (t === 'sub') return 1;
    return 0.5;
  });

// nodes
const node = g.append('g')
  .selectAll('circle').data(nodes).join('circle')
  .attr('r', d => d.r)
  .attr('fill', d => {
    const c = nodeColor(d);
    if (d.type === 'root')   return '#0d0d1a';
    if (d.type === 'folder') return `${c}18`;
    if (d.type === 'sub')    return `${c}12`;
    return `${c}0a`;
  })
  .attr('stroke', d => nodeColor(d))
  .attr('stroke-width', d => d.type === 'root' ? 2 : d.type === 'folder' ? 1.5 : d.type === 'sub' ? 1 : 0.5)
  .attr('stroke-opacity', d => d.type === 'leaf' ? 0.25 : 0.8)
  .style('filter', d => d.type !== 'leaf' ? 'url(#glow)' : '')
  .call(d3.drag()
    .on('start', (e,d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on('end',   (e,d) => { if (!e.active) sim.alphaTarget(0); if(d.type!=='root'){d.fx=null;d.fy=null;} })
  );

// labels — only root, folder, sub
const label = g.append('g')
  .selectAll('text')
  .data(nodes.filter(d => d.type !== 'leaf'))
  .join('text')
  .attr('text-anchor','middle')
  .attr('dy','0.35em')
  .attr('font-size', d => d.type==='root' ? 10 : d.type==='folder' ? 8 : 7)
  .attr('font-weight', d => d.type==='root' ? 700 : 500)
  .attr('font-family', 'SF Mono, Fira Code, monospace')
  .attr('fill', d => nodeColor(d))
  .attr('pointer-events','none')
  .text(d => d.label.length > 10 ? d.label.slice(0,9)+'…' : d.label);

// tooltip
const tooltip = document.getElementById('tooltip');
node.on('mouseover', (e,d) => {
  if (d.type === 'leaf') {
    tooltip.style.display = 'block';
    document.getElementById('tt-topic').textContent = d.label;
    document.getElementById('tt-sub').textContent = (d.folder + (d.sub ? ' › ' + d.sub : '')).toUpperCase();
    document.getElementById('tt-date').textContent = d.date || '';
  }
}).on('mousemove', e => {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY - 10) + 'px';
}).on('mouseout', () => { tooltip.style.display = 'none'; });

// Fix root center
const rootNode = nodes.find(n => n.id === 'LOKI');
rootNode.fx = W/2; rootNode.fy = H/2;

sim.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('cx',d=>d.x).attr('cy',d=>d.y);
  label.attr('x',d=>d.x).attr('y',d=>d.y);
});

// ── Stats ───────────────────────────────────────────
const total = RAW.length;
const byFolder = {};
RAW.forEach(n => {
  const key = n.sub ? n.folder+'/'+n.sub : n.folder;
  byFolder[key] = (byFolder[key]||0) + 1;
});
const recentDays = 14;
const now = new Date();
const recent = RAW.filter(n => {
  if (!n.date) return false;
  const d = new Date(n.date);
  return (now - d) / 86400000 <= recentDays;
}).length;

const statsData = [
  { num: total, label: 'Total Files', color: '#26c6da' },
  { num: byFolder['memory/learnings']||0, label: 'Learnings', color: '#26c6da' },
  { num: byFolder['memory/retrospectives']||0, label: 'Sessions', color: '#7e57c2' },
  { num: Object.keys(byFolder).filter(k=>k.startsWith('learn/')).reduce((a,k)=>a+(byFolder[k]||0),0), label: 'Code Studies', color: '#66bb6a' },
  { num: recent, label: 'Last 14 days', color: '#ffa726' },
];

const statsRow = document.getElementById('stats-row');
statsData.forEach(s => {
  statsRow.innerHTML += `
    <div class="stat-card" style="--accent: ${s.color}">
      <div class="stat-num">${s.num}</div>
      <div class="stat-label">${s.label}</div>
    </div>`;
});

// ── Legend ──────────────────────────────────────────
const legendData = [
  { label:'Learnings', c:'#26c6da' },
  { label:'Retrospectives', c:'#7e57c2' },
  { label:'Code Studies', c:'#66bb6a' },
  { label:'Lab', c:'#ec407a' },
  { label:'Resonance', c:'#ffa726' },
];
const legendEl = document.getElementById('legend');
legendData.forEach(l => {
  legendEl.innerHTML += `
    <div class="legend-item">
      <div class="legend-dot" style="--c:${l.c};border-color:${l.c}"></div>
      ${l.label}
    </div>`;
});

// ── Folder Grid ─────────────────────────────────────
const folderDefs = [
  { id:'memory/learnings',     name:'Learnings',    color:'#26c6da' },
  { id:'memory/retrospectives',name:'Sessions',     color:'#7e57c2' },
  { id:'memory/resonance',     name:'Resonance',    color:'#ffa726' },
  { id:'learn/PrismarineJS',   name:'PrismarineJS', color:'#66bb6a' },
  { id:'learn/zirz1911',       name:'zirz1911',     color:'#66bb6a' },
  { id:'learn/affaan-m',       name:'affaan-m',     color:'#4db6ac' },
  { id:'learn/Lissy93',        name:'Lissy93',      color:'#4db6ac' },
  { id:'learn/VoltAgent',      name:'VoltAgent',    color:'#4db6ac' },
  { id:'learn/droidrun',       name:'droidrun',     color:'#4db6ac' },
  { id:'learn/crewaiinc',      name:'crewaiinc',    color:'#4db6ac' },
  { id:'learn/maw-js',         name:'maw-js',       color:'#4db6ac' },
  { id:'lab/outputs',          name:'Lab',          color:'#ec407a' },
];

const grid = document.getElementById('folder-grid');
folderDefs.forEach(fd => {
  const count = byFolder[fd.id] || 0;
  if (!count) return;
  const topics = RAW.filter(n => (n.folder+'/'+n.sub)===fd.id || (n.folder===fd.id && !n.sub))
                    .slice(0,5).map(n=>n.topic);
  const pct = Math.round(count / total * 100);
  grid.innerHTML += `
    <div class="folder-card" style="--fc:${fd.color}">
      <div class="fc-header">
        <span class="fc-name">${fd.name}</span>
        <span class="fc-count">${count}</span>
      </div>
      <div class="fc-bar"><div class="fc-bar-fill" style="width:${pct}%;background:${fd.color}"></div></div>
      <div class="fc-topics">
        ${topics.map(t=>`<span class="topic-pill">${t}</span>`).join('')}
      </div>
    </div>`;
});
</script>
</body>
</html>
